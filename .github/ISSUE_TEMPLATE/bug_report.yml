name: Bug report
description: File a bug report for APFS Explorer
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please fill in as much
        detail as possible. For **data-loss or corruption bugs**, mark the title
        with `[CRITICAL]` — these are triaged within 24 hours.

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11 24H2
        - Windows 11 23H2
        - Windows 11 22H2
        - Windows 10 22H2
        - Windows 10 21H2
        - Other (describe below)
    validations:
      required: true

  - type: input
    id: winfsp-version
    attributes:
      label: WinFsp version
      description: "Run `sc query winfsp` or check Programs and Features."
      placeholder: "e.g. 2.0.23075"
    validations:
      required: true

  - type: input
    id: apfs-explorer-version
    attributes:
      label: APFS Explorer version
      placeholder: "e.g. 1.0.0-rc1"
    validations:
      required: true

  - type: dropdown
    id: apfs-source
    attributes:
      label: APFS volume source
      options:
        - Physical USB/Thunderbolt drive
        - Raw disk image (.img / .dmg)
        - Network share / iSCSI
        - Other (describe below)
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version that created the volume (if known)
      placeholder: "e.g. macOS 15.4 Sequoia"

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Provide the exact steps to trigger the bug.
      placeholder: |
        1. Mount volume with `apfs-explorer mount ...`
        2. Run `...`
        3. Observe `...`
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Paste relevant log output here. Run with `RUST_LOG=apfs_explorer=debug`
        to capture verbose output. Redact personal file paths if needed.
      render: text

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I am not reporting a security vulnerability (use Security Advisories for that).
          required: true
