<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d6bf6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="disk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe7fb"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="30" flood-color="#0a1a4d" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- app tile -->
  <rect x="64" y="64" width="896" height="896" rx="220" fill="url(#bg)"/>
  <!-- soft top sheen -->
  <path d="M284 64 H804 A220 220 0 0 1 960 284 V392 Q512 250 64 392 V284 A220 220 0 0 1 284 64 Z"
        fill="#ffffff" opacity="0.10"/>

  <!-- disk stack (container with stacked volumes / CoW layers) -->
  <g filter="url(#sh)">
    <path d="M300 348 V676 A212 70 0 0 0 724 676 V348 Z" fill="url(#disk)"/>
    <ellipse cx="512" cy="348" rx="212" ry="70" fill="#ffffff"/>
  </g>

  <!-- volume division arcs (front-facing) -->
  <path d="M306 458 A206 64 0 0 0 718 458" fill="none" stroke="#2563eb" stroke-width="14" stroke-opacity="0.30" stroke-linecap="round"/>
  <path d="M306 566 A206 64 0 0 0 718 566" fill="none" stroke="#2563eb" stroke-width="14" stroke-opacity="0.30" stroke-linecap="round"/>

  <!-- active-volume indicator -->
  <circle cx="628" cy="392" r="20" fill="#22c55e"/>
</svg>
