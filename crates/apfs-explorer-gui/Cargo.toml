[package]
name = "apfs-explorer-gui"
version = "1.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "apfs-explorer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
thiserror = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Track Tauri's transitive `windows` version to avoid linking two copies into
# the same binary.  Tauri 2.x pulls in windows 0.61; matching here halves
# compile time and unifies feature flags.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_Security",
  "Win32_System_Wmi",
  "Win32_System_Rpc",
  "Win32_System_Variant",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
] }
windows-core = "0.61"
