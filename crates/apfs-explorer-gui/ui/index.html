<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>APFS Explorer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>APFS Explorer</h1>
      <button id="refresh-btn" class="btn btn-ghost icon-btn" title="Refresh drives" aria-label="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      </button>
    </header>

    <main class="content">
      <section>
        <h2 class="section-title">Detected drives</h2>
        <div id="detected" class="drive-list">
          <div class="empty">Scanning…</div>
        </div>
      </section>

      <section>
        <h2 class="section-title">Mounted</h2>
        <div id="mounted" class="drive-list">
          <div class="empty">Nothing mounted yet.</div>
        </div>
      </section>
    </main>

    <footer class="status-bar" id="status-bar">Ready.</footer>

    <!-- In-app confirmation modal (replaces the native confirm() chrome). -->
    <div id="modal-overlay" class="modal-overlay" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h3 id="modal-title" class="modal-title"></h3>
        <p id="modal-message" class="modal-message"></p>
        <div class="modal-actions">
          <button id="modal-cancel" type="button" class="btn btn-outline">Cancel</button>
          <button id="modal-confirm" type="button" class="btn btn-primary">Confirm</button>
        </div>
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
